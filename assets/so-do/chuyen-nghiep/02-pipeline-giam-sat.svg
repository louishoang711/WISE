  <text x="600" y="376" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="9" font-weight="400" letter-spacing="0" fill="#182b43">100100  →  100110  →  100111</text>
  <text x="600" y="400" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="9" font-weight="400" letter-spacing="0" fill="#182b43">frequency=5  ·  timeframe=10s  ·  same_field=client</text>
  <text x="600" y="428" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0" fill="#245db1">5.000 cảnh báo mức 12 · 16/11/2026</text>
  <text x="600" y="452" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#53677d">Nhật ký ghi nhận hơn 23.387 sự kiện trong phiên.</text>
