<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="02-pipeline-giam-sat-title 02-pipeline-giam-sat-desc" id="d-02-pipeline-giam-sat-root">
  <title id="02-pipeline-giam-sat-title">Luồng giám sát Wazuh WIDS</title>
  <desc id="02-pipeline-giam-sat-desc">Cảm biến thu frame quản lý 802.11, Wazuh Agent chuyển nhật ký và Manager tương quan theo client trước khi cảnh báo được lập chỉ mục và hiển thị.</desc>
