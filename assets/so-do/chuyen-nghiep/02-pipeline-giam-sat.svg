      <style>#d-02-pipeline-giam-sat-root { color: #182b43; font-family: 'Segoe UI', Arial, sans-serif; }
      #d-02-pipeline-giam-sat-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-02-pipeline-giam-sat-root .diagram-container:focus-visible { outline: 2px solid #245db1; outline-offset: 2px; }
      #d-02-pipeline-giam-sat-root nav { padding: 0 24px 12px; font-size: 0.875rem; }
      #d-02-pipeline-giam-sat-root nav ul { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0; padding: 0; list-style: none; }
      #d-02-pipeline-giam-sat-root a { color: #245db1; text-underline-offset: 3px; }
      @media print {
#d-02-pipeline-giam-sat-root .diagram-container { overflow-x: visible; }
      #d-02-pipeline-giam-sat-root nav { display: none; }
