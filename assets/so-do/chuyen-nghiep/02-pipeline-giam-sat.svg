  <text x="816" y="235" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#53677d">Tra cứu và</text>
  <text x="816" y="251" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#53677d">lấy mốc giờ</text>
  <rect x="40" y="320" width="520" height="196" rx="8" fill="#ffffff" stroke="#cfd9e4"/>
  <text x="56" y="348" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0" fill="#182b43">Định dạng log từ cảm biến</text>
  <text x="56" y="376" text-anchor="start" font-family="Consolas, 'Courier New', monospace" font-size="9" font-weight="400" letter-spacing="0" fill="#182b43">WIFI-WIDS type=deauth bssid=&lt;bssid&gt; client=&lt;client&gt; channel=0 count=1</text>
  <text x="56" y="404" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#53677d">Script ghi deauth và disassoc dưới cùng nhãn type=deauth.</text>
  <text x="56" y="424" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#53677d">channel=0 là giá trị cố định trong log. Kênh thu theo card Wi-Fi.</text>
  <text x="56" y="452" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#53677d">Rule hiện có cho WPS (100120) và Rogue AP (100130).</text>
  <text x="56" y="472" text-anchor="start" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#53677d">Cảm biến hiện chưa sinh hai loại sự kiện này.</text>
  <rect x="584" y="320" width="336" height="196" rx="8" fill="#ffffff" stroke="#cfd9e4"/>
